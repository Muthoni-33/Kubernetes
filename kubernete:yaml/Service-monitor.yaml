apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: app-monitor
  labels:
    release: prometheus

spec:

  selector:
    matchLabels:
      app: app-service

  namespaceSelector:
    matchNames:
      - default

  endpoints:

    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s