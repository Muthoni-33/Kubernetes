apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app

  minReplicas: 4
  maxReplicas: 10

  metrics:
    type: Resource
    resource:
      name: cpu

      target:
        type: utilization
        averageUtilization: 70